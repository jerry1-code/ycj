<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ycj sandbox</title>
  <style>
    body{font-family:ui-sans-serif,system-ui,sans-serif;background:#0f172a;color:#e2e8f0;
         display:grid;place-items:center;min-height:100vh;margin:0}
    .card{background:#1e293b;padding:2.5rem 3rem;border-radius:14px;
          box-shadow:0 10px 40px rgba(0,0,0,.45);text-align:center}
    h1{margin:0 0 .5rem;font-size:1.6rem}
    code{background:#334155;padding:.15rem .4rem;border-radius:4px}
    p{color:#94a3b8;margin:.4rem 0}
  </style>
</head>
<body>
  <div class="card">
    <h1>ycj sandbox is live</h1>
    <p>served from <code>/workspace/public</code> on <code>127.0.0.1:3000</code></p>
    <p>tunneled through Cloudflare &mdash; see <code>/workspace/tunnel/</code></p>
  </div>
</body>
</html>
